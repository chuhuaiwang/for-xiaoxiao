name: Rename to index
on:
  push:
    paths:
      - .github/workflows/rename.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f space-slim.html ] && [ ! -f index.html ]; then
            git config user.name "chuhuaiwang"
            git config user.email "chuhuaiwang@users.noreply.github.com"
            git mv space-slim.html index.html
            git commit -m "Rename space-slim.html to index.html"
            git push
          fi
